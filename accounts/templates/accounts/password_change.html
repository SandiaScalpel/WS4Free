{% extends "weather/base_generic.html" %}
{% block title %}Change password · WS4Free{% endblock %}
{% block content %}
<div class="mx-auto max-w-md pt-4">
  <a href="{% url 'accounts:settings' %}" class="text-sm no-underline">&larr; Settings</a>
  <div class="card mt-3 p-6 sm:p-8">
    <h1 class="text-xl font-bold">Change password</h1>
    <p class="mt-1 text-sm text-muted">At least 12 characters. A long passphrase is easiest.</p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="btn btn-primary btn-block mt-2">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
