# WS4Free with PostgreSQL 17.  docker compose -f compose.postgres.yaml up -d

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ws4free}
      POSTGRES_USER: ${DB_USER:-ws4free}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    image: ws4free:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${WS4FREE_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ws4free:latest
    restart: unless-stopped
    command: ["scheduler"]
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - app-data:/app/data
    depends_on:
      web:
        condition: service_started

volumes:
  postgres-data:
  app-data:
