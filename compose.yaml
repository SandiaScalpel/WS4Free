# WS4Free with MySQL 8.4.
#
#   cp .env.docker.example .env      # then edit it
#   docker compose up -d
#   docker compose exec web python manage.py createsuperuser
#
# For PostgreSQL instead:  docker compose -f compose.postgres.yaml up -d

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ws4free}
      MYSQL_USER: ${DB_USER:-ws4free}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # The official image loads the time zone tables on first start, which
      # WS4Free's local-day summaries need (see README, "MySQL time zone tables").
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    image: ws4free:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "${WS4FREE_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ws4free:latest
    restart: unless-stopped
    command: ["scheduler"]
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - app-data:/app/data
    depends_on:
      web:
        condition: service_started

volumes:
  mysql-data:
  app-data:
